<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b70"><meta name="description" content="東京ディズニーランド・シーのDPA販売終了傾向を、公開データをもとに参考予測するツール"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icons/icon-192.png"><title>ディズニーDPA販売終了予測</title>
<style>
:root{color-scheme:light;--navy:#173b70;--blue:#2d66b3;--pale:#eef5ff;--ink:#18263a;--muted:#64748b;--line:#d8e2f0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#edf5ff,#fff 58%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}header{background:var(--navy);color:#fff;padding:24px 16px;text-align:center}header .mark{font-size:28px}h1{font-size:clamp(1.25rem,4vw,1.8rem);line-height:1.3;margin:6px auto;max-width:800px}header p{margin:8px auto 0;color:#dbeafe;max-width:700px;font-size:.93rem}main{width:min(850px,100%);margin:0 auto;padding:18px 14px 40px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 15px;box-shadow:0 8px 26px #173b7010}h2{font-size:1.18rem;margin:0 0 10px}label{display:block;font-weight:750;margin:12px 0 5px}select,input{font:inherit;width:100%;padding:11px 12px;border:1px solid #b9c9dd;border-radius:10px;background:white;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hint{font-size:.84rem;color:var(--muted);margin:6px 0}.notice{font-size:.86rem;color:#5c6574;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:6px}.warn{color:#7c3d00;background:#fff7e6;border-color:#f2c36b}button{display:inline-block;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:800;padding:11px 15px;cursor:pointer;text-align:center}button:focus-visible,input:focus,select:focus{outline:3px solid #bfdbfe}.result{display:none}.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.metric{background:var(--pale);border-radius:12px;padding:13px}.metric small{display:block;color:var(--muted);font-weight:700}.metric strong{font-size:1.25rem;color:var(--navy);display:block;overflow-wrap:anywhere}.foot{text-align:center;color:var(--muted);font-size:.8rem;padding:0 14px 24px}.sources li{margin:7px 0}a{color:#1d4f91}.status{font-size:.84rem;color:var(--muted)}@media(max-width:560px){.grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr}.panel{padding:15px}}
</style></head><body><header><div class="mark" aria-hidden="true">🏰 📊</div><h1>ディズニー DPA販売終了予測</h1><p>公開されている過去の傾向を参考に、販売終了の可能性と時刻の目安を確認</p></header>
<main><section class="panel"><h2>販売終了を予測する</h2><div class="grid"><div><label for="sim-date">来園日</label><input type="date" id="sim-date"></div><div><label for="sim-park">パーク</label><select id="sim-park"><option value="tdl">東京ディズニーランド</option><option value="tds">東京ディズニーシー</option></select></div></div><label for="sim-attraction">対象施設</label><select id="sim-attraction"></select><button id="predict-btn" type="button">予測を見る</button><div id="prediction" class="result" aria-live="polite"><div class="metric-grid"><div class="metric"><small>売り切れ確率</small><strong id="probability">—</strong></div><div class="metric"><small>販売終了時刻の目安</small><strong id="median-time">—</strong></div><div class="metric"><small>データの充実度</small><strong id="confidence">—</strong></div></div><p id="prediction-summary"></p><p id="prediction-caveat" class="notice"></p></div></section>
<section class="panel"><h2>ご利用にあたって</h2><p class="notice">売り切れ時刻は目安です。購入前に公式アプリで販売状況をご確認ください。</p></section></main><footer class="foot">非公式の参考ツールです。© DPA販売終了予測</footer><script src="./app.js" defer></script></body></html>
